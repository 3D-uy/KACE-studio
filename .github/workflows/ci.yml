name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  KACE_BOOTSTRAP_REF: 5ea7af1345a5c00e1e17627da6c11c20c75493f5
  KACE_BOOTSTRAP_SHA256: eb8104963c082178118d3efddedc35b8d4fae104c5c76c730341c1dd37ce92bd

jobs:
  test:
    name: Run Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgirepository1.0-dev gcc libcairo2-dev pkg-config python3-dev \
          gir1.2-gtk-3.0
        sudo apt-get install -y gir1.2-webkit2-4.0 || sudo apt-get install -y gir1.2-webkit2-4.1

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Reject developer-local paths
      run: python scripts/check_portability.py

    - name: Fetch and verify pinned KACE bootstrap
      run: |
        python -c "import os, urllib.request; ref=os.environ['KACE_BOOTSTRAP_REF']; urllib.request.urlretrieve(f'https://raw.githubusercontent.com/3D-uy/KACE/{ref}/scripts/bootstrap.sh', 'bootstrap.sh')"
        python -c "import hashlib, os, pathlib; actual=hashlib.sha256(pathlib.Path('bootstrap.sh').read_bytes()).hexdigest(); expected=os.environ['KACE_BOOTSTRAP_SHA256']; assert actual == expected, f'bootstrap.sh SHA-256 mismatch: {actual} != {expected}'"

    - name: Run Backend Tests
      run: |
        python -m pytest -v > pytest_run.log 2>&1
        cat pytest_run.log

    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-logs-${{ matrix.os }}-py${{ matrix.python-version }}
        path: pytest_run.log
        if-no-files-found: warn
        retention-days: 7

  build-windows:
    name: Build Windows Executable
    needs: test
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Fetch and verify pinned KACE bootstrap
      run: |
        python -c "import os, urllib.request; ref=os.environ['KACE_BOOTSTRAP_REF']; urllib.request.urlretrieve(f'https://raw.githubusercontent.com/3D-uy/KACE/{ref}/scripts/bootstrap.sh', 'bootstrap.sh')"
        python -c "import hashlib, os, pathlib; actual=hashlib.sha256(pathlib.Path('bootstrap.sh').read_bytes()).hexdigest(); expected=os.environ['KACE_BOOTSTRAP_SHA256']; assert actual == expected, f'bootstrap.sh SHA-256 mismatch: {actual} != {expected}'"

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --clean -y main.spec

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KACE-studio-Windows
        path: dist/KACE-studio.exe
        if-no-files-found: error
