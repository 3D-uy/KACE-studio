name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Require signing secrets and run all publication-blocking gates
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  lint-shell:
    name: Validate Critical Shell Contract
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Install pinned ShellCheck
      env:
        SHELLCHECK_VERSION: v0.11.0
        SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
      run: |
        archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
        curl --fail --silent --show-error --location \
          "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${archive}" \
          --output "${RUNNER_TEMP}/${archive}"
        echo "${SHELLCHECK_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
        tar -xJf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
        echo "${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}" >> "${GITHUB_PATH}"

    - name: Validate bundled bootstrap syntax and semantics
      run: |
        bash -n bootstrap.sh
        shellcheck --severity=warning bootstrap.sh

  test:
    name: Run Tests
    needs: lint-shell
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
        python-version: ["3.11.9", "3.12.10"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: requirements.lock

    - name: Set up pinned Node for mandatory frontend coverage
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "24.19.0"

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgirepository1.0-dev gcc libcairo2-dev pkg-config python3-dev \
          gir1.2-gtk-3.0
        sudo apt-get install -y gir1.2-webkit2-4.0 || sudo apt-get install -y gir1.2-webkit2-4.1

    - name: Install Dependencies
      run: |
        python -m pip install --require-hashes -r requirements.lock

    - name: Reject developer-local paths
      run: python scripts/check_portability.py

    # Source validation uses the committed bootstrap; release fetches stay in build jobs.
    - name: Verify source bootstrap identity
      id: source
      run: python scripts/check_ci_source.py --evidence "${{ runner.temp }}/studio-ci/source-before.json"

    - name: Run Backend Tests
      id: tests
      run: python -m pytest -v --junitxml="${{ runner.temp }}/studio-ci/pytest-results.xml"

    - name: Require unchanged bootstrap and complete frontend coverage
      if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.tests.outcome != 'skipped' }}
      run: python scripts/check_ci_source.py --junit "${{ runner.temp }}/studio-ci/pytest-results.xml" --evidence "${{ runner.temp }}/studio-ci/source-after.json"

    - name: Upload source test evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: pytest-logs-${{ matrix.os }}-py${{ matrix.python-version }}
        path: ${{ runner.temp }}/studio-ci/
        if-no-files-found: error
        retention-days: 7

  preflight-integration:
    name: Real Core and Studio Preflight (amd64)
    needs: lint-shell
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      DOCKER_DEFAULT_PLATFORM: linux/amd64
    steps:
    - name: Initialize isolated evidence directory
      run: |
        gate="$RUNNER_TEMP/preflight-integration"
        mkdir -p "$gate/evidence" "$gate/tmp" "$gate/cache" "$gate/local"
        printf '%s\n' \
          "GATE=$gate" "TMPDIR=$gate/tmp" "XDG_CACHE_HOME=$gate/cache" "LOCALAPPDATA=$gate/local" \
          "KACE_KLIPPER_PREFLIGHT_RECEIPT=$gate/evidence/core-receipt.json" \
          "KACE_STUDIO_PREFLIGHT_RECEIPT=$gate/evidence/studio-receipt.json" >> "$GITHUB_ENV"

    - name: Checkout Studio source under test
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        ref: ${{ github.sha }}
        path: KACE-studio
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12.10"

    - name: Read and validate immutable Core references
      id: contract
      working-directory: KACE-studio
      run: |
        python - <<'PY'
        import json, os, subprocess
        from pathlib import Path
        from scripts.release import load_contract, verify_inputs
        contract = load_contract()
        verified = verify_inputs(contract)
        kace = contract['kace']
        if kace['repository'] != 'https://github.com/3D-uy/KACE.git' or kace['runtime_status'] != 'pinned':
            raise SystemExit('Integration requires the pinned published KACE repository')
        if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != os.environ['GITHUB_SHA']:
            raise SystemExit('Studio checkout differs from the workflow source')
        with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
            for key in ('candidate_ref', 'bootstrap_ref'):
                output.write(f'{key}={verified[key]}\n')
        Path(os.environ['GATE'], 'evidence', 'contract.json').write_text(json.dumps(verified, indent=2, default=str), encoding='utf-8')
        PY

    - name: Checkout published Core producer with runtime history
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        repository: 3D-uy/KACE
        ref: ${{ steps.contract.outputs.bootstrap_ref }}
        path: KACE
        fetch-depth: 0
        persist-credentials: false

    - name: Verify local candidate and record source identities
      id: identities
      working-directory: KACE-studio
      run: |
        python - <<'PY'
        import hashlib, os, subprocess
        from pathlib import Path
        from scripts.release import load_contract, verify_local_candidate
        kace = load_contract()['kace']
        source = Path('../KACE')
        head = subprocess.check_output(['git', '-C', str(source), 'rev-parse', 'HEAD'], text=True).strip()
        if head != kace['bootstrap_ref']:
            raise SystemExit('Core checkout differs from bootstrap producer')
        verify_local_candidate(source, kace['candidate_ref'])
        verify_local_candidate(source, kace['bootstrap_ref'])
        for name, expected in kace['required_runtime_files'].items():
            if hashlib.sha256((source / name).read_bytes()).hexdigest() != expected:
                raise SystemExit(f'Working runtime differs from candidate: {name}')
        producer = (source / 'scripts/bootstrap.sh').read_bytes()
        if hashlib.sha256(producer).hexdigest() != kace['bootstrap_sha256'] or producer != Path('bootstrap.sh').read_bytes():
            raise SystemExit('Bootstrap producer and bundled resource differ')
        PY
        python scripts/sync_preflight.py --source ../KACE --check
        for repo in KACE KACE-studio; do
          (cd "../$repo"; git rev-parse HEAD; git status --porcelain) > "$GATE/evidence/$repo-source.txt"
          (cd "../$repo"; git ls-files -z | xargs -0 sha256sum) > "$GATE/evidence/$repo-before.sha256"
        done

    - name: Install isolated locked test environments
      run: |
        sudo apt-get update
        sudo apt-get install -y libgirepository1.0-dev gcc libcairo2-dev pkg-config python3-dev gir1.2-gtk-3.0
        sudo apt-get install -y gir1.2-webkit2-4.0 || sudo apt-get install -y gir1.2-webkit2-4.1
        python -m venv "$GATE/core-venv"
        python -m venv "$GATE/studio-venv"
        "$GATE/core-venv/bin/python" -m pip install --require-hashes -r KACE/requirements-dev.txt -r KACE/requirements-ssh.txt
        "$GATE/studio-venv/bin/python" -m pip install --require-hashes -r KACE-studio/requirements.lock
        python --version > "$GATE/evidence/python-version.txt"
        docker version > "$GATE/evidence/docker-version.txt"

    - name: Provision and test real Core loader
      working-directory: KACE
      run: |
        "$GATE/core-venv/bin/python" -B -m core.klipper_preflight --provision 2>&1 | tee "$GATE/evidence/core-provision.log"
        KACE_C3_DOCKER_INTEGRATION=1 "$GATE/core-venv/bin/python" -B -m pytest \
          tests/integration/test_config_transaction_klipper_preflight.py \
          tests/integration/test_firmware_klipper_preflight.py \
          tests/integration/test_configuration_operation_preflight.py \
          -q -rs -p no:cacheprovider --basetemp "$GATE/core-pytest" \
          --junitxml "$GATE/evidence/core.xml" 2>&1 | tee "$GATE/evidence/core-tests.log"

    - name: Provision and test real Studio to Core protocol
      working-directory: KACE-studio
      run: |
        "$GATE/studio-venv/bin/python" -B - <<'PY' 2>&1 | tee "$GATE/evidence/studio-provision.log"
        import json, os
        from pathlib import Path
        from backend.klipper_preflight import DockerPreflight
        print(json.dumps(DockerPreflight(receipt_path=Path(os.environ['KACE_STUDIO_PREFLIGHT_RECEIPT'])).prepare(), indent=2))
        PY
        KACE_STUDIO_PREFLIGHT_INTEGRATION=1 "$GATE/studio-venv/bin/python" -B -m pytest \
          tests/test_studio_preflight_integration.py \
          tests/test_local_candidate_identity.py \
          tests/test_pc_klipper_preflight.py::test_bundled_runner_matches_authoritative_kace \
          tests/test_release_pc_context_gate.py tests/test_studio_preflight_bootstrap.py \
          -q -rs -p no:cacheprovider \
          --basetemp "$GATE/studio-pytest" --junitxml "$GATE/evidence/studio.xml" \
          2>&1 | tee "$GATE/evidence/studio-tests.log"

    - name: Require all 22 real-loader and 31 contract cases without omissions
      run: |
        python - <<'PY'
        import os
        from pathlib import Path
        from xml.etree import ElementTree as ET
        for name, expected in (('core', 16), ('studio', 37)):
            tree = ET.parse(Path(os.environ['GATE'], 'evidence', name + '.xml'))
            cases = tree.findall('.//testcase')
            if len(cases) != expected or any(case.find(tag) is not None for case in cases for tag in ('failure', 'error', 'skipped')):
                raise SystemExit(f'{name}: expected exactly {expected} successful cases without skips')
        PY

    - name: Record and verify provisioned image architectures
      if: ${{ always() && steps.identities.outcome == 'success' }}
      run: |
        python - <<'PY'
        import json, os, subprocess
        from pathlib import Path
        evidence = Path(os.environ['GATE'], 'evidence')
        for name in ('core', 'studio'):
            receipt = evidence / (name + '-receipt.json')
            if receipt.is_file():
                image = json.loads(receipt.read_text())['image_id']
                result = subprocess.run(['docker', 'image', 'inspect', image], capture_output=True, text=True, check=True)
                (evidence / (name + '-image.json')).write_text(result.stdout, encoding='utf-8')
                inspected = json.loads(result.stdout)[0]
                if (inspected['Os'], inspected['Architecture']) != ('linux', 'amd64'):
                    raise SystemExit(f'{name}: expected a linux/amd64 loader image')
        PY

    - name: Verify unchanged source trees
      if: ${{ always() && steps.identities.outcome == 'success' }}
      run: |
        for repo in KACE KACE-studio; do
          (cd "$repo"; sha256sum --check --strict "$GATE/evidence/$repo-before.sha256") > "$GATE/evidence/$repo-after.log"
          git -C "$repo" status --porcelain > "$GATE/evidence/$repo-status-after.txt"
          test -z "$(git -C "$repo" status --porcelain --untracked-files=no)"
        done

    - name: Upload real preflight evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: preflight-integration-${{ github.sha }}
        path: ${{ runner.temp }}/preflight-integration/evidence/
        if-no-files-found: error
        retention-days: 7

  build-windows:
    name: Build Windows Executable
    needs: [test, preflight-integration]
    # This existing required check must fail, not be skipped, when a gate fails.
    if: ${{ always() }}
    runs-on: windows-2025
    steps:
    - name: Require successful source and integration gates
      shell: pwsh
      env:
        SOURCE_TEST_RESULT: ${{ needs.test.result }}
        PREFLIGHT_RESULT: ${{ needs.preflight-integration.result }}
      run: |
        if ($env:SOURCE_TEST_RESULT -ne 'success' -or $env:PREFLIGHT_RESULT -ne 'success') {
          throw 'Source tests and real preflight must both succeed before packaging.'
        }

    - name: Checkout Code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12.10"
        cache: 'pip'
        cache-dependency-path: requirements.lock

    - name: Install Dependencies
      run: |
        python -m pip install --require-hashes -r requirements.lock

    - name: Fetch and verify pinned KACE bootstrap
      run: python scripts/release.py fetch-bootstrap && python scripts/release.py verify-remote-installer

    - name: Verify immutable release inputs
      run: python scripts/release.py verify-inputs

    - name: Fix reproducible build environment
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        "PYTHONHASHSEED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Build Executable with PyInstaller
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        python -m PyInstaller --clean -y main.spec
        Copy-Item dist\KACE-studio.exe build\KACE-studio.repro-reference.exe
        python -m PyInstaller --clean -y main.spec

    - name: Require deterministic repeated build
      run: python scripts/release.py verify-rebuild build/KACE-studio.repro-reference.exe dist/KACE-studio.exe

    - name: Verify bundled bytes, PE metadata, and write primary manifest
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        python scripts/release.py verify-bundle dist/KACE-studio.exe
        python scripts/release.py verify-metadata dist/KACE-studio.exe
        dist\KACE-studio.exe --verify-package
        python scripts/smoke_executable.py dist/KACE-studio.exe --timeout 45
        python scripts/release.py write-manifest dist/KACE-studio.exe dist/KACE-studio.release.json --reproducible-reference build/KACE-studio.repro-reference.exe

    - name: Upload primary unsigned build evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: KACE-studio-Windows-primary-${{ github.sha }}
        path: |
          dist/KACE-studio.exe
          dist/KACE-studio.release.json
        if-no-files-found: error

  independent-windows-builder:
    name: Independent Windows Rebuild
    needs: build-windows
    runs-on: windows-2025
    steps:
    - name: Checkout Code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12.10"
        cache: 'pip'
        cache-dependency-path: requirements.lock

    - name: Install Dependencies
      run: python -m pip install --require-hashes -r requirements.lock

    - name: Fetch and verify immutable inputs
      run: python scripts/release.py fetch-bootstrap && python scripts/release.py verify-remote-installer && python scripts/release.py verify-inputs

    - name: Fix reproducible build environment
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        "PYTHONHASHSEED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Build independently from the same commit
      run: python -m PyInstaller --clean -y main.spec

    - name: Download primary build evidence
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        name: KACE-studio-Windows-primary-${{ github.sha }}
        path: primary

    - name: Require byte-identical independent build
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        python scripts/release.py write-independent-attestation primary/KACE-studio.release.json primary/KACE-studio.exe dist/KACE-studio.exe dist/KACE-studio.independent-build.json
        python scripts/release.py attach-independent-attestation primary/KACE-studio.release.json dist/KACE-studio.independent-build.json dist/KACE-studio.release.json
        python scripts/release.py verify-metadata dist/KACE-studio.exe
        dist\KACE-studio.exe --verify-package
        python scripts/smoke_executable.py dist/KACE-studio.exe --timeout 45

    - name: Upload independently reproduced unsigned artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: KACE-studio-Windows-${{ github.sha }}
        path: dist/
        if-no-files-found: error

  signed-release-gates:
    name: Signed Release Gates
    needs: independent-windows-builder
    if: github.event_name == 'workflow_dispatch' && inputs.release_candidate
    runs-on: windows-2025
    steps:
    - name: Checkout Code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12.10"
        cache: 'pip'
        cache-dependency-path: requirements.lock

    - name: Install Dependencies
      run: python -m pip install --require-hashes -r requirements.lock

    - name: Fetch and verify immutable inputs
      run: python scripts/release.py fetch-bootstrap && python scripts/release.py verify-remote-installer && python scripts/release.py verify-inputs

    - name: Download independently reproduced unsigned artifact
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        name: KACE-studio-Windows-${{ github.sha }}
        path: dist/candidate

    - name: Require signing identity and certificate secrets
      shell: pwsh
      env:
        WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
        WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        KACE_SIGNING_CERT_SHA256: ${{ secrets.KACE_SIGNING_CERT_SHA256 }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64)) { throw 'WINDOWS_SIGNING_PFX_BASE64 is required' }
        if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD)) { throw 'WINDOWS_SIGNING_PFX_PASSWORD is required' }
        if ($env:KACE_SIGNING_CERT_SHA256 -notmatch '^[0-9a-f]{64}$') { throw 'KACE_SIGNING_CERT_SHA256 must be a lowercase SHA-256' }

    - name: Sign release candidate with SHA-256 and trusted timestamp
      shell: pwsh
      env:
        WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
        WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        $pfxPath = Join-Path $env:RUNNER_TEMP 'kace-studio-signing.pfx'
        [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
        try {
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          if ($null -eq $signTool) { throw 'signtool.exe is unavailable' }
          & $signTool.FullName sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /f $pfxPath /p $env:WINDOWS_SIGNING_PFX_PASSWORD dist\candidate\KACE-studio.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE" }
        } finally {
          Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
        }

    - name: Finalize manifest and enforce all release gates
      shell: pwsh
      env:
        KACE_SIGNING_CERT_SHA256: ${{ secrets.KACE_SIGNING_CERT_SHA256 }}
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        python scripts/release.py finalize-signed-manifest dist/candidate/KACE-studio.release.json dist/candidate/KACE-studio.exe dist/candidate/KACE-studio.independent-build.json dist/candidate/KACE-studio.signed.release.json --expected-certificate-sha256 $env:KACE_SIGNING_CERT_SHA256
        python scripts/release.py verify-release-gates dist/candidate/KACE-studio.exe dist/candidate/KACE-studio.signed.release.json dist/candidate/KACE-studio.independent-build.json --expected-certificate-sha256 $env:KACE_SIGNING_CERT_SHA256

    - name: Upload signed release candidate evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: KACE-studio-Windows-signed-${{ github.sha }}
        path: |
          dist/candidate/KACE-studio.exe
          dist/candidate/KACE-studio.signed.release.json
          dist/candidate/KACE-studio.independent-build.json
        if-no-files-found: error
